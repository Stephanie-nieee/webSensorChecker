<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1b4d43" />
  <title>手機感應器檢查</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #f3efe6;
      --card: #fffdf8;
      --ink: #1c1915;
      --muted: #5c564c;
      --line: #e3d8c6;
      --pine: #1b4d43;
      --pine-soft: #e6f2ee;
      --on-pine: #f3faf7;
      --yes: #0e6a3a;
      --yes-bg: #e3f6ea;
      --no: #a31d2c;
      --no-bg: #fdecee;
      --warn: #8a6d1d;
      --warn-bg: #f5f0e0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.5;
    }

    button:not(:disabled) {
      cursor: pointer;
    }

    button:focus-visible {
      outline: 3px solid var(--pine);
      outline-offset: 3px;
    }

    main {
      max-width: 36rem;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }


    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      width: 3.5rem;
      height: 3.5rem;
      border-radius: 1rem;
      background: var(--pine);
      color: var(--on-pine);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-icon svg {
      width: 1.75rem;
      height: 1.75rem;
    }

    .brand p {
      margin: 0;
      font-size: 1.125rem;
      font-weight: 500;
      color: var(--pine);
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.25;
    }

    .lead {
      margin: 0;
      font-size: 1.2rem;
      color: var(--muted);
    }

    .note {
      margin: 0;
      padding: 1rem 1.2rem;
      border-radius: 1rem;
      font-size: 1.15rem;
    }

    .note-warn {
      background: var(--pine-soft);
      color: var(--pine);
    }

    .note-error {
      background: var(--no-bg);
      color: var(--no);
    }

    .primary-btn {
      min-height: 3.75rem;
      width: 100%;
      border: none;
      border-radius: 1rem;
      background: var(--pine);
      color: var(--on-pine);
      font: inherit;
      font-size: 1.4rem;
      font-weight: 700;
      padding: 0.9rem 1.25rem;
    }

    .primary-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .hint {
      margin: 0;
      font-size: 1.15rem;
    }

    .progress {
      height: 0.7rem;
      border-radius: 999px;
      background: var(--line);
      overflow: hidden;
    }

    .progress>span {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--pine);
      border-radius: 999px;
    }

    .verdict {
      border: 2px solid var(--line);
      background: var(--card);
      border-radius: 1.25rem;
      padding: 1.25rem;
    }

    .verdict.yes {
      border-color: var(--yes);
      background: var(--yes-bg);
    }

    .verdict.no {
      border-color: var(--no);
      background: var(--no-bg);
    }

    .verdict.checking {
      border-color: var(--pine);
      background: var(--pine-soft);
    }

    .verdict.incomplete {
      border-color: #c4b48a;
      background: var(--warn-bg);
    }

    .verdict .label {
      margin: 0 0 0.35rem;
      font-size: 1.05rem;
      color: var(--muted);
    }

    .verdict .title {
      margin: 0;
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.25;
    }

    .verdict.yes .title {
      color: var(--yes);
    }

    .verdict.no .title {
      color: var(--no);
    }

    .verdict.checking .title {
      color: var(--pine);
    }

    .verdict.incomplete .title {
      color: var(--warn);
    }

    .verdict .detail {
      margin: 0.4rem 0 0;
      font-size: 1.15rem;
    }

    .info-card,
    .sensor-card {
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 1.25rem;
      padding: 1rem 1.2rem;
    }

    .info-card .k {
      margin: 0;
      font-size: 1.05rem;
      color: var(--muted);
    }

    .info-card .v {
      margin: 0.2rem 0 0;
      font-size: 1.35rem;
      font-weight: 600;
      word-break: break-word;
    }

    .section-label {
      margin: 0.5rem 0 0;
      font-size: 1.05rem;
      color: var(--muted);
    }

    .sensor-card {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      margin-top: 0.7rem;
    }

    .sensor-head h3 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 600;
    }

    .sensor-head p {
      margin: 0.1rem 0 0;
      font-size: 1rem;
      color: var(--muted);
    }

    .sensor-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 2.75rem;
      padding: 0 0.9rem;
      border-radius: 999px;
      font-size: 1.3rem;
      font-weight: 700;
    }

    .pill-yes {
      background: var(--yes-bg);
      color: var(--yes);
    }

    .pill-no {
      background: var(--no-bg);
      color: var(--no);
    }

    .pill-checking {
      background: var(--pine-soft);
      color: var(--pine);
    }

    .pill-pending {
      background: var(--paper);
      color: var(--muted);
      font-weight: 600;
    }

    .details-btn {
      min-height: 2.75rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      color: var(--ink);
      font: inherit;
      font-size: 1.15rem;
      font-weight: 600;
      padding: 0 1.1rem;
    }

    .details-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .details-panel {
      border-top: 1px solid var(--line);
      padding-top: 0.85rem;
      display: none;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 1.25rem;
      font-variant-numeric: tabular-nums;
    }

    .details-panel.open {
      display: flex;
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <rect x="7" y="2" width="10" height="20" rx="2" />
            <path d="M12 18h.01" />
          </svg>
        </span>
        <p>研究招募用</p>
      </div>
      <h1 style="margin-top:1rem">這手機可以參加研究嗎？</h1>
      <p class="lead" style="margin-top:1rem">請按下面的按鈕，檢查手機感應器。</p>
    </header>

    <p id="embeddedNote" class="note note-warn" hidden>
      請用手機瀏覽器直接打開這個網頁。
    </p>
    <p id="insecureNote" class="note note-error" hidden>
      請用 https 開頭的網址打開。
    </p>

    <button type="button" class="primary-btn" id="startBtn">開始檢查</button>
    <p class="hint" id="hintText">如果手機詢問權限，請按「允許」。</p>
    <div class="progress" id="progressBar" hidden><span></span></div>
    <p id="permissionNote" class="note note-error" hidden></p>

    <section class="verdict" id="verdictBox">
      <p class="label">判定</p>
      <p class="title" id="verdictTitle">尚未檢查</p>
      <p class="detail" id="verdictDetail">手機三項感應器都有，才可以參加研究。</p>
      <p class="detail" id="desktopHint" hidden>請用手機打開再檢查一次。</p>
    </section>

    <section>
      <p class="section-label">感應器</p>

      <article class="sensor-card" data-key="gyroscope">
        <div class="sensor-head">
          <h3>陀螺儀</h3>
          <p>Gyroscope</p>
        </div>
        <div class="sensor-actions">
          <span class="pill pill-pending" data-pill>未檢查</span>
          <button type="button" class="details-btn" data-details disabled>詳細資料</button>
        </div>
        <div class="details-panel" data-panel></div>
      </article>

      <article class="sensor-card" data-key="magnetometer">
        <div class="sensor-head">
          <h3>磁力計</h3>
          <p>Magnetometer</p>
        </div>
        <div class="sensor-actions">
          <span class="pill pill-pending" data-pill>未檢查</span>
          <button type="button" class="details-btn" data-details disabled>詳細資料</button>
        </div>
        <div class="details-panel" data-panel></div>
      </article>

      <article class="sensor-card" data-key="accelerometer">
        <div class="sensor-head">
          <h3>加速度計</h3>
          <p>Accelerometer</p>
        </div>
        <div class="sensor-actions">
          <span class="pill pill-pending" data-pill>未檢查</span>
          <button type="button" class="details-btn" data-details disabled>詳細資料</button>
        </div>
        <div class="details-panel" data-panel></div>
      </article>
    </section>

    <section>
      <p class="section-label">裝置</p>
      <div class="info-card" style="margin-top:0.7rem">
        <p class="k">裝置型號代碼</p>
        <p class="v" id="modelId">讀取中…</p>
      </div>
      <div class="info-card" style="margin-top:0.7rem">
        <p class="k">裝置名稱</p>
        <p class="v" id="modelName">讀取中…</p>
      </div>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      // Max wait for samples. Finishes earlier if all 3 sensors already look OK.
      var CHECK_MS = 2000;
      var KEYS = ["gyroscope", "magnetometer", "accelerometer"];
      var LABELS = {
        gyroscope: "陀螺儀",
        magnetometer: "磁力計",
        accelerometer: "加速度計"
      };

      var state = {
        phase: "idle",          // idle | checking | done | incomplete
        slots: {
          gyroscope: { status: "pending" },
          magnetometer: { status: "pending" },
          accelerometer: { status: "pending" }
        },
        live: {
          accelerometer: null,
          gyroscope: null,
          magnetometer: null,
          heading: null
        },
        permissionNote: null,
        device: null,
        openKey: null
      };

      var stopFns = [];
      var emitTimer = null;

      function $(id) {
        return document.getElementById(id);
      }

      function num(v) {
        return typeof v === "number" && isFinite(v) ? v : null;
      }

      function fmt(v) {
        return v == null ? "—" : v.toFixed(2);
      }

      function axis(src) {
        if (!src) return null;
        var a = { x: num(src.x), y: num(src.y), z: num(src.z) };
        if (a.x == null && a.y == null && a.z == null) return null;
        return a;
      }

      function complete(a) {
        return !!(a && a.x != null && a.y != null && a.z != null);
      }

      function mag(a) {
        return complete(a) ? Math.hypot(a.x, a.y, a.z) : null;
      }

      function toDeg(a) {
        if (!a) return null;
        function c(v) { return v == null ? null : (v * 180) / Math.PI; }
        return { x: c(a.x), y: c(a.y), z: c(a.z) };
      }

      function judgeAccel(samples) {
        var mags = samples.map(mag).filter(function (v) { return v != null; });
        if (mags.some(function (v) { return v >= 5 && v <= 15; })) return "yes";
        if (mags.filter(function (v) { return v > 0.3; }).length >= 3) return "yes";
        return "no";
      }

      function judgeGyro(samples) {
        var ok = samples.filter(complete);
        if (ok.length === 0) return "no";
        var peak = Math.max.apply(null, ok.map(function (a) {
          return Math.hypot(a.x, a.y, a.z);
        }));
        if (peak > 1 || ok.length >= 3) return "yes";
        return "no";
      }

      function judgeMag(fields, headings, absolute) {
        var mags = fields.map(mag).filter(function (v) { return v != null; });
        if (mags.some(function (v) { return v >= 10 && v <= 100; })) return "yes";
        if (mags.filter(function (v) { return v > 5; }).length >= 3) return "yes";
        if (headings.some(function (h) { return !h.unreliable; })) return "yes";
        if (absolute) return "yes";
        return "no";
      }

      function verdict() {
        if (state.phase === "idle") {
          return { title: "尚未檢查", detail: "三項都有，才可以參加研究。", tone: "idle" };
        }
        if (state.phase === "checking") {
          return { title: "正在檢查", detail: "請稍候...", tone: "checking" };
        }
        // Permission was denied — not a hardware fail
        if (state.phase === "incomplete") {
          return {
            title: "尚未完成檢查",
            detail: "",
            tone: "incomplete"
          };
        }
        var missing = KEYS.filter(function (k) {
          return state.slots[k].status !== "yes";
        }).map(function (k) { return LABELS[k]; });
        if (missing.length === 0) {
          return { title: "此手機可以參加研究", detail: "", tone: "yes" };
        }
        return {
          title: "此手機無法參加研究",
          detail: "缺少：" + missing.join("、"),
          tone: "no"
        };
      }

      function setPill(el, status) {
        el.className = "pill";
        if (status === "yes") {
          el.classList.add("pill-yes");
          el.textContent = "有 Yes";
        } else if (status === "no") {
          el.classList.add("pill-no");
          el.textContent = "無 No";
        } else if (status === "checking") {
          el.classList.add("pill-checking");
          el.textContent = "檢查中";
        } else {
          el.classList.add("pill-pending");
          el.textContent = "未檢查";
        }
      }

      function xyzHtml(a) {
        a = a || { x: null, y: null, z: null };
        return "X: " + fmt(a.x) + "<br>Y: " + fmt(a.y) + "<br>Z: " + fmt(a.z);
      }

      function magDetailsHtml() {
        var a = state.live.magnetometer || { x: null, y: null, z: null };
        var lines = [
          "X: " + fmt(a.x) + " µT",
          "Y: " + fmt(a.y) + " µT",
          "Z: " + fmt(a.z) + " µT",
          "方向: " + (state.live.heading != null ? Math.round(state.live.heading) + "°" : "—")
        ];
        return lines.join("<br>");
      }

      function render() {
        var v = verdict();
        var box = $("verdictBox");
        box.className = "verdict" + (v.tone !== "idle" ? " " + v.tone : "");
        $("verdictTitle").textContent = v.title;
        $("verdictDetail").textContent = v.detail;
        $("verdictDetail").hidden = !v.detail;

        $("desktopHint").hidden = !(
          state.phase === "done" && state.device && !state.device.mobile
        );

        $("startBtn").disabled = state.phase === "checking";
        $("startBtn").textContent =
          state.phase === "checking" ? "檢查中…" :
            (state.phase === "done" || state.phase === "incomplete") ? "再檢查一次" :
              "開始檢查";

        $("hintText").textContent =
          state.phase === "checking" ? "請稍候..." :
            state.phase === "incomplete" ? "請按「允許 / Allow」以手機檢查感應器" :
              state.phase === "done" ? "可按「詳細資料」看 X Y Z。" :
                "如果手機詢問權限，請按「允許」。";

        $("progressBar").hidden = state.phase !== "checking";

        if (state.permissionNote) {
          $("permissionNote").hidden = false;
          $("permissionNote").textContent = state.permissionNote;
        } else {
          $("permissionNote").hidden = true;
        }

        if (state.device) {
          $("modelId").textContent = state.device.modelId;
          $("modelName").textContent = state.device.modelName;
        }

        KEYS.forEach(function (key) {
          var card = document.querySelector('.sensor-card[data-key="' + key + '"]');
          setPill(card.querySelector("[data-pill]"), state.slots[key].status);

          var btn = card.querySelector("[data-details]");
          // Details only after a real completed check
          btn.disabled = state.phase !== "done";
          btn.textContent = state.openKey === key ? "收起" : "詳細資料";

          var panel = card.querySelector("[data-panel]");
          var open = state.openKey === key && state.phase === "done";
          panel.classList.toggle("open", open);
          if (open) {
            panel.innerHTML = key === "magnetometer"
              ? magDetailsHtml()
              : xyzHtml(state.live[key]);
          }
        });
      }

      function emitSoon() {
        if (emitTimer) return;
        emitTimer = setTimeout(function () {
          emitTimer = null;
          render();
        }, 100);
      }

      function stopAll() {
        stopFns.forEach(function (fn) {
          try { fn(); } catch (e) { }
        });
        stopFns = [];
        if (emitTimer) {
          clearTimeout(emitTimer);
          emitTimer = null;
        }
        stopProgressBar();
      }

      // Always call requestPermission again on each check start (user gesture).
      // iOS: if user previously chose "Don't Allow", the system may NOT show
      // the prompt again — they must change it in Settings → Safari → Motion & Orientation.
      function askPermission(kind) {
        var name = kind === "motion" ? "DeviceMotionEvent" : "DeviceOrientationEvent";
        var Host = window[name];
        if (!Host || typeof Host.requestPermission !== "function") {
          return Promise.resolve("granted");
        }
        return Host.requestPermission().then(
          function (r) { return r || "denied"; },
          function () { return "denied"; }
        );
      }

      function compassFrom(ev) {
        if (typeof ev.webkitCompassHeading === "number" && isFinite(ev.webkitCompassHeading)) {
          var acc = ev.webkitCompassAccuracy;
          return {
            deg: ev.webkitCompassHeading,
            unreliable: typeof acc === "number" && acc < 0
          };
        }
        if (ev.absolute && typeof ev.alpha === "number" && isFinite(ev.alpha)) {
          return { deg: ev.alpha, unreliable: false };
        }
        return null;
      }

      function sensorCtor(name) {
        return typeof window[name] === "function" ? window[name] : null;
      }

      async function readDevice() {
        var ua = navigator.userAgent || "";
        var uaData = navigator.userAgentData;
        var model = "";
        var mobile = !!(uaData && uaData.mobile);

        try {
          if (uaData && uaData.getHighEntropyValues) {
            var hints = await uaData.getHighEntropyValues(["model", "mobile"]);
            model = (hints.model || "").trim();
            if (typeof hints.mobile === "boolean") mobile = hints.mobile;
          }
        } catch (e) { }

        var ios = /iPad|iPhone|iPod/.test(ua);
        var ipad = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
        var android = ua.match(/Android\s[0-9.]+;\s*([^;)]+)/);

        if (!model && android) {
          model = android[1].replace(/\s+Build\/.*$/, "").trim();
          if (/^(Mobile|Linux|K|wv)$/i.test(model)) model = "";
        }
        if (ios || ipad) mobile = true;
        if (!mobile) mobile = /Mobi|Android|iPhone|iPad|iPod/i.test(ua);

        if ((ios || ipad) && !model) {
          return {
            modelId: "無法取得",
            modelName: ipad || /iPad/.test(ua) ? "iPad" : "iPhone",
            mobile: mobile
          };
        }
        if (!model) {
          return { modelId: "無法取得", modelName: "無法取得", mobile: mobile };
        }
        return { modelId: model, modelName: model, mobile: mobile };
      }

      var progressTimer = null;

      function startProgressBar() {
        stopProgressBar();
        var fill = document.getElementById("progressFill");
        if (!fill) return;
        fill.style.width = "0%";
        var t0 = Date.now();
        progressTimer = setInterval(function () {
          var p = Math.min(100, ((Date.now() - t0) / CHECK_MS) * 100);
          fill.style.width = p + "%";
          if (p >= 100) stopProgressBar();
        }, 50);
      }

      function stopProgressBar() {
        if (progressTimer) {
          clearInterval(progressTimer);
          progressTimer = null;
        }
        var fill = document.getElementById("progressFill");
        if (fill) fill.style.width = "100%";
      }

      function startCheck() {
        // After permission denied, reload so the next gesture can re-request cleanly
        if (state.phase === "incomplete") {
          window.location.reload();
          return;
        }

        stopAll();
        state.openKey = null;
        state.permissionNote = null;
        state.phase = "checking";
        state.slots = {
          gyroscope: { status: "checking" },
          magnetometer: { status: "checking" },
          accelerometer: { status: "checking" }
        };
        state.live = { accelerometer: null, gyroscope: null, magnetometer: null, heading: null };
        render();

        var bar = $("progressBar");
        bar.hidden = false;
        bar.innerHTML = '<span id="progressFill"></span>';
        startProgressBar();

        var accelSamples = [];
        var gyroSamples = [];
        var magSamples = [];
        var headings = [];
        var absolute = false;
        var stopped = false;
        var finished = false;

        stopFns.push(function () { stopped = true; });

        function push(bucket, a) {
          if (!complete(a)) return;
          bucket.push(a);
          if (bucket.length > 120) bucket.shift();
        }

        function noteAccel(a) {
          if (!complete(a)) return;
          state.live.accelerometer = a;
          push(accelSamples, a);
          emitSoon();
          tryEarlyFinish();
        }

        function noteGyro(a) {
          if (!complete(a)) return;
          state.live.gyroscope = a;
          push(gyroSamples, a);
          emitSoon();
          tryEarlyFinish();
        }

        function noteMag(a) {
          if (!complete(a)) return;
          state.live.magnetometer = a;
          push(magSamples, a);
          emitSoon();
          tryEarlyFinish();
        }

        // End early once all three already pass (no need to wait full 2s)
        function tryEarlyFinish() {
          if (finished || stopped) return;
          if (
            judgeGyro(gyroSamples) === "yes" &&
            judgeAccel(accelSamples) === "yes" &&
            judgeMag(magSamples, headings, absolute) === "yes"
          ) {
            finish("done");
          }
        }

        function finish(phase) {
          if (finished || stopped) return;
          finished = true;
          stopProgressBar();

          if (phase === "incomplete") {
            state.phase = "incomplete";
            state.slots = {
              gyroscope: { status: "pending" },
              magnetometer: { status: "pending" },
              accelerometer: { status: "pending" }
            };
            state.permissionNote = "請按「允許 / Allow」以手機檢查感應器";
            render();
            return;
          }

          var gyro = judgeGyro(gyroSamples);
          var mag = judgeMag(magSamples, headings, absolute);
          var accel = judgeAccel(accelSamples);

          state.slots = {
            gyroscope: { status: gyro },
            magnetometer: { status: mag },
            accelerometer: { status: accel }
          };
          state.phase = "done";
          render();
        }

        // Ask permission every time the user taps 開始檢查 (must stay in click stack)
        Promise.all([askPermission("motion"), askPermission("orientation")]).then(function (perms) {
          if (stopped) return;
          var motionPerm = perms[0];
          var orientPerm = perms[1];

          if (!window.isSecureContext) {
            state.permissionNote = "請用 https 開頭的網址再檢查。";
            state.slots = {
              gyroscope: { status: "no" },
              magnetometer: { status: "no" },
              accelerometer: { status: "no" }
            };
            state.phase = "done";
            finished = true;
            render();
            return;
          }

          // Denied → incomplete (not a hardware fail). Sensors stay 未檢查.
          if (motionPerm === "denied" || orientPerm === "denied") {
            finish("incomplete");
            return;
          }

          function onMotion(ev) {
            noteAccel(axis(ev.accelerationIncludingGravity) || axis(ev.acceleration));
            var r = ev.rotationRate;
            noteGyro(r ? axis({ x: r.alpha, y: r.beta, z: r.gamma }) : null);
          }

          function onOrient(ev) {
            var h = compassFrom(ev);
            if (h) {
              headings.push(h);
              if (!h.unreliable || state.live.heading == null) {
                state.live.heading = h.deg;
              }
              emitSoon();
              tryEarlyFinish();
            }
          }

          window.addEventListener("devicemotion", onMotion);
          window.addEventListener("deviceorientation", onOrient);
          window.addEventListener("deviceorientationabsolute", onOrient);
          stopFns.push(function () {
            window.removeEventListener("devicemotion", onMotion);
            window.removeEventListener("deviceorientation", onOrient);
            window.removeEventListener("deviceorientationabsolute", onOrient);
          });

          function openSensor(name, onRead) {
            var Ctor = sensorCtor(name);
            if (!Ctor) return;
            try {
              var s = new Ctor({ frequency: 20 });
              s.addEventListener("reading", function () { onRead(axis(s)); });
              s.start();
              stopFns.push(function () {
                try { s.stop(); } catch (e) { }
              });
            } catch (e) { }
          }

          openSensor("Accelerometer", noteAccel);
          openSensor("Gyroscope", function (a) { noteGyro(toDeg(a)); });
          openSensor("Magnetometer", noteMag);

          var Abs = sensorCtor("AbsoluteOrientationSensor");
          if (Abs) {
            try {
              var s = new Abs({ frequency: 10 });
              s.addEventListener("reading", function () {
                absolute = true;
                tryEarlyFinish();
              });
              s.start();
              stopFns.push(function () {
                try { s.stop(); } catch (e) { }
              });
            } catch (e) { }
          }

          var t = setTimeout(function () {
            if (!stopped && !finished) finish("done");
          }, CHECK_MS);
          stopFns.push(function () { clearTimeout(t); });
          render();
        });
      }

      $("startBtn").addEventListener("click", startCheck);

      document.querySelectorAll(".sensor-card").forEach(function (card) {
        card.querySelector("[data-details]").addEventListener("click", function () {
          var key = card.getAttribute("data-key");
          state.openKey = state.openKey === key ? null : key;
          render();
        });
      });

      try {
        if (window.self !== window.top) $("embeddedNote").hidden = false;
      } catch (e) {
        $("embeddedNote").hidden = false;
      }
      if (!window.isSecureContext) $("insecureNote").hidden = false;

      readDevice().then(function (d) {
        state.device = d;
        render();
      });

      render();
    })();
  </script>
</body>

</html>
